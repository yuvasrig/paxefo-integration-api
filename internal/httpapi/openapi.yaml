openapi: 3.0.3
info:
  title: PAXAFE Tive Integration API
  version: 0.1.0
  description: |
    Receives **Tive** tracker webhook payloads, stores each one untouched, and turns it into **PAXAFE** sensor and
    location records. This page is the API contract. The service also has an operator console (the *admin view*) at
    [`/admin/`](/admin/), which is where tenants, keys, rules, payloads, conflicts and alerts are managed.

    ## Quick start
    1. **Get a key.** An operator creates a tenant in the console (`/admin/`, tab *Tenants*) and copies its API key
       (`pxk_test_...`). The key identifies the tenant; send it in the `X-API-Key` header.
    2. **Send a payload.** `POST /api/webhook/tive` with Tive's JSON body.
    3. **Read the answer.** The response carries the `status`, the PAXAFE `sensor` and `location` records, and any
       quality `flags`. `GET /api/v1/events/{id}` returns the same later, together with the raw payload.

    ```bash
    curl -i -X POST https://paxafe-api.onrender.com/api/webhook/tive \
      -H 'X-API-Key: pxk_test_...' -H 'Content-Type: application/json' -d @payload.json
    ```
    A free-tier instance sleeps when idle; the first request can take about a minute.

    ## What happens to a payload
    1. The key is checked and the **raw payload is stored untouched** (it is never modified or deleted).
    2. **Rules** clean it: numeric strings are coerced, sentinel values such as `-32768` are cleared, seconds
       timestamps are scaled, ranges are checked, a device named only by `DeviceName` is resolved. Each fix is
       reported as a **flag**; one bad field does not reject the reading.
    3. It is **transformed** into the PAXAFE `sensor` and `location` records (rounded only at output, and
       validated against the PAXAFE JSON schemas).
    4. The outcome is stored and returned. The reading's identity is `(tenant, device IMEI, EntryTimeEpoch)`.

    ## Status values
    | status | meaning | HTTP |
    |---|---|---|
    | `accepted` | Stored, nothing to report | 200 |
    | `flagged` | Stored, with one or more flags (a value was cleared, converted or defaulted) | 200 |
    | `duplicate` | The same reading with identical content was already stored; nothing written | 200 |
    | `conflict` | The same reading arrived earlier with *different* content; the tenant's conflict policy decides | 200 or 409 |
    | `rejected` | No timestamp or no usable data; no PAXAFE record. The raw payload is still stored | 422 |
    | `failed` | A server error after the raw payload was saved; recoverable with the replay endpoint | 500 |
    | `queued` | Async tenants only: stored and queued, processed shortly after | 202 |

    Precedence when several apply: rejected > conflict > duplicate > flagged > accepted.

    ## Ingest modes
    A tenant is **sync** (processed before the answer, `200`) or **async** (the payload and a queue job are
    committed, the answer is `202 {"status":"queued"}`, and that tenant's own worker pool processes it). Read an async
    result with `GET /api/v1/events/{id}`. When an async tenant's queue is full the answer is `503` with `Retry-After`
    and nothing is stored. There is no rate limiting: Tive cannot be throttled (see ADR 0002 in the repository).

    ## Conflicts
    A second payload for the same device and time with different content is a conflict. The tenant's policy decides:
    `keep_first` (default: the stored reading stays), `keep_last` (the new version replaces it; the old event stays
    archived) or `reject` (nothing written). Both versions are always kept. The tenant also chooses whether a conflict is
    answered `200` or `409`.

    ## Flags
    | code | severity | meaning |
    |---|---|---|
    | `SENSOR_FAULT` | warn | A sentinel temperature (`-32768`, `327.67`, `32767`) was cleared |
    | `TEMPERATURE_FALLBACK` | info | The device temperature was unusable; the probe temperature was used |
    | `TEMPERATURE_CONVERTED` | info | Only Fahrenheit was sent; Celsius was computed |
    | `OUT_OF_RANGE` | warn | A humidity, light or battery value outside its range was cleared |
    | `INVALID_COORDINATES` | error | Latitude or longitude outside the valid range; no location record |
    | `COERCED_TYPE` | info | A numeric value sent as a string was converted |
    | `TIMESTAMP_SECONDS` | warn | The timestamp was in seconds and was scaled to milliseconds |
    | `TIMESTAMP_FUTURE` | error | The timestamp is too far in the future; the reading is rejected |
    | `INVALID_TYPE` | warn | A value of the wrong type (for example text where a number belongs) was cleared |
    | `DEVICE_RESOLVED_BY_NAME` | info | The device id was resolved from `DeviceName` |
    | `IDENTITY_MISMATCH` | warn | `EntityName`, `DeviceName` or `DeviceId` disagree |
    | `NO_DEVICE_IDENTITY` | error | No usable device identity; the reading is rejected |
    | `NO_TIMESTAMP` | error | No usable timestamp; the reading is rejected |
    | `NO_USABLE_DATA` | error | No temperature and no location after cleaning; the reading is rejected |
    | `DUPLICATE_CONFLICT` | warn | The reading conflicts with a stored one (see Conflicts) |

    The rules are configurable per deployment and per tenant, so the live list is `GET /api/v1/rules`.

    ## Errors
    Errors use one envelope: `{"error": {"code": "...", "message": "..."}}`. `400` invalid JSON (the raw bytes are
    still stored), `401` missing, invalid, expired or revoked key, `413` body over 256 KB (nothing saved), `404`
    unknown event or not visible to this tenant, `422` rejected, `503` queue full or not ready.

    ## Not part of this contract
    Tenant, key, rule and settings management, alerts and the payload and comparison views are in the admin view at
    [`/admin/`](/admin/) (and the `api` command line), not in this HTTP API.
tags:
  - name: Ingest
    description: Receive Tive payloads. Authenticated with a tenant API key.
  - name: Events
    description: Read back what was stored for an event, or reprocess it.
  - name: Readings
    description: Query a device's PAXAFE records.
  - name: Rules
    description: The quality rules in force.
  - name: Operations
    description: Probes, metrics and this contract. No key needed.
servers:
  - url: https://paxafe-api.onrender.com
  - url: http://localhost:8080
security:
  - ApiKey: []

paths:
  /api/webhook/tive:
    post:
      operationId: ingestTive
      tags: [Ingest]
      summary: Ingest one Tive payload
      description: |
        The raw payload is committed before any 2xx. The tenant is the API key's; the payload's `AccountId` is stored
        as metadata and never checked, and `EntryTimeUtc` is ignored (`EntryTimeEpoch` is the event time).
        `/api/v1/webhook/tive` is an alias for the same handler.
        `status` is `flagged` if and only if the response carries any flag. When several statuses apply, precedence is
        rejected > conflict > duplicate > flagged > accepted. A conflict follows the tenant's conflict policy
        (`keep_first` default, `keep_last`, `reject`). A request id may be supplied in `X-Request-ID`; it is echoed back.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TivePayload' }
            examples:
              normal:
                summary: A normal reading
                value:
                  EntityName: B234567
                  EntryTimeEpoch: 1739999999000
                  DeviceId: '866088073468440'
                  DeviceName: B234567
                  AccountId: 478
                  Temperature: { Celsius: 4.5, Fahrenheit: 40.1 }
                  ProbeTemperature: { Celsius: 3.875, Fahrenheit: 38.975 }
                  Humidity: { Percentage: 55.3 }
                  Battery: { Percentage: 82 }
                  Cellular: { Dbm: -75 }
                  Location: { Latitude: 37.7749, Longitude: -122.4194, Accuracy: { Meters: 5 }, LocationMethod: gps, FormattedAddress: 'San Francisco, CA 94102, USA' }
              sensor_fault:
                summary: Sensor fault and an impossible latitude
                value:
                  EntityName: B234567
                  EntryTimeEpoch: 1739999888000
                  DeviceId: '866088073468440'
                  Temperature: { Celsius: -32768 }
                  ProbeTemperature: { Celsius: 3.875 }
                  Location: { Latitude: 95, Longitude: -71.06 }
      responses:
        '200':
          description: Processed (accepted, flagged, duplicate, or conflict when the tenant's conflict `http_status` is 200)
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResponse' }
              examples:
                accepted:
                  summary: accepted (the normal reading above)
                  value:
                    event_id: evt_01M6T2ZQK7XEAK9AX3H7AH0QRZ
                    request_id: req_dfe94c1e211c8e2fdcec68e0
                    status: accepted
                    sensor: { device_id: B234567, device_imei: '866088073468440', timestamp: 1739999999000, provider: Tive, type: Active, temperature: 4.5, humidity: 55.3, light_level: null, accelerometer: null, tilt: null, box_open: null }
                    location: { device_id: B234567, device_imei: '866088073468440', timestamp: 1739999999000, provider: Tive, type: Active, latitude: 37.7749, longitude: -122.4194, altitude: null, location_accuracy: 5, location_accuracy_category: High, location_source: GPS, address: { street: null, locality: San Francisco, state: CA, country: USA, postal_code: '94102', full_address: 'San Francisco, CA 94102, USA' }, battery_level: 82, cellular_dbm: -75, cellular_network_type: null, cellular_operator: null, wifi_access_points: 0 }
                    flags: []
                    errors: []
                flagged:
                  summary: flagged (the sensor-fault reading above)
                  value:
                    event_id: evt_01M6T2ZY2W02W6542A73VPBXZ7
                    request_id: req_a68d76410eb34ab9520dc5bc
                    status: flagged
                    sensor: { device_id: '866088073468440', device_imei: '866088073468440', timestamp: 1739999888000, provider: Tive, type: Active, temperature: 3.88, humidity: null, light_level: null, accelerometer: null, tilt: null, box_open: null }
                    location: null
                    flags:
                      - { code: SENSOR_FAULT, severity: warn, field: Temperature.Celsius, value: -32768, action: nullified, rule_id: TEMP-SENTINEL }
                      - { code: INVALID_COORDINATES, severity: error, field: Location.Latitude, value: 95, action: location_skipped, rule_id: LAT-RANGE }
                      - { code: TEMPERATURE_FALLBACK, severity: info, field: Temperature.Celsius, new_value: 3.875, action: fixed }
                    errors: []
        '202':
          description: |
            Queued (tenants in async ingest mode only). The raw payload and its queue job are committed; a worker
            processes the event shortly after. Read the result with `GET /api/v1/events/{id}`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResponse' }
        '400': { $ref: '#/components/responses/InvalidJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: |
            Conflict: the same device and time arrived earlier with different content, and the tenant's conflict
            `http_status` is 409 (the default for policy `reject`). The body is the usual envelope with status `conflict`;
            the raw payload is still archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResponse' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422':
          description: Unusable record (rejected); raw payload is still stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResponse' }
        '503':
          description: |
            The tenant's queue is full (async ingest mode, `code: QUEUE_FULL`). Nothing was stored; retry after the
            number of seconds in `Retry-After`.
          headers: { Retry-After: { schema: { type: integer } } }
        '500':
          description: Failure after the raw payload was saved; event status `failed`, recoverable via replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResponse' }
  /api/v1/webhook/tive:
    post:
      operationId: ingestTiveV1
      tags: [Ingest]
      summary: Alias of /api/webhook/tive (the path the exercise requires)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TivePayload' }
      responses:
        '200': { description: Same as /api/webhook/tive, content: { application/json: { schema: { $ref: '#/components/schemas/IngestResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { description: Unusable record, content: { application/json: { schema: { $ref: '#/components/schemas/IngestResponse' } } } }
        '500': { description: Failure after raw save, content: { application/json: { schema: { $ref: '#/components/schemas/IngestResponse' } } } }

  /api/v1/events/{id}:
    get:
      operationId: getEvent
      tags: [Events]
      summary: Raw event, outcome, flags and PAXAFE output
      description: |
        Visible only to the tenant that owns the event.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: evt_01JABCDEF } }
      responses:
        '200':
          description: Event found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/events/{id}/replay:
    post:
      operationId: replayEvent
      tags: [Events]
      summary: Re-run a failed or rejected event from its stored raw payload
      description: |
        Only failed, rejected or unfinished events can be replayed. Idempotent: readings are inserted with ON CONFLICT. The raw payload is never modified.
        Returns the same envelope as the webhook with the new outcome.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Event is already processed (accepted, flagged, duplicate or conflict); nothing to replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/readings:
    get:
      operationId: listReadings
      tags: [Readings]
      summary: Sensor and location readings for a device (cursor-paginated)
      parameters:
        - { name: device_id, in: query, required: true, schema: { type: string, example: A571992 } }
        - { name: from, in: query, required: false, schema: { type: integer, format: int64 }, description: Epoch ms, inclusive }
        - { name: to, in: query, required: false, schema: { type: integer, format: int64 }, description: Epoch ms, exclusive }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Page of readings, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingsPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/rules:
    get:
      operationId: getRules
      tags: [Rules]
      summary: The ruleset currently in force
      description: |
        Rules are configurable at runtime (`api rules set`), so this can change between two calls. `source` says where the
        ruleset in force came from: `default` (embedded), `file` (RULES_PATH) or `database` (published at runtime).
      responses:
        '200':
          description: Active rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string, example: 2026-11-06.1 }
                  source: { type: string, enum: [default, file, database] }
                  loaded_at: { type: string, format: date-time }
                  rules: { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /healthz:
    get:
      operationId: healthz
      tags: [Operations]
      summary: Liveness
      security: []
      responses:
        '200':
          description: Process is up
          content: { application/json: { schema: { type: object, properties: { status: { type: string, example: ok } } } } }
  /readyz:
    get:
      operationId: readyz
      tags: [Operations]
      summary: Readiness (database, migration version, storage backend, ingest mode)
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  migration_version: { type: integer }
                  storage_backend: { type: string, enum: [postgres, timescale] }
                  ingest_mode: { type: string, enum: [sync, async] }
        '503': { description: Not ready (database unreachable) }
  /metrics:
    get:
      operationId: metrics
      tags: [Operations]
      summary: Prometheus metrics
      security: []
      responses:
        '200': { description: Prometheus text format, content: { text/plain: { schema: { type: string } } } }
  /docs:
    get:
      operationId: docs
      tags: [Operations]
      summary: Redoc API documentation
      security: []
      responses:
        '200': { description: HTML, content: { text/html: { schema: { type: string } } } }
  /openapi.yaml:
    get:
      operationId: openapi
      tags: [Operations]
      summary: This contract
      security: []
      responses:
        '200': { description: YAML, content: { application/yaml: { schema: { type: string } } } }

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Format pxk_test_<base62>. Bound to a tenant; expired or revoked keys return 401.'

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
  headers:
    RequestId:
      schema: { type: string }
      description: Echo of the supplied or generated request id
    RetryAfter:
      schema: { type: integer }
      description: Seconds to wait before retrying

  responses:
    InvalidJson:
      description: Body is not valid JSON; raw bytes are still stored
      content:
        application/json:
          schema: { $ref: '#/components/schemas/IngestResponse' }
    Unauthorized:
      description: Missing, invalid, expired or revoked API key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooLarge:
      description: Body larger than 256 KB; nothing saved
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Unknown id, or not visible to this tenant
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    TivePayload:
      type: object
      description: |
        Tive webhook payload. Validated leniently: see assignment/tive-incoming-schema.json for the
        nominal shape, DESIGN.md §5 for what is rejected versus flagged. Unknown extra fields are accepted.
      additionalProperties: true
      properties:
        EntityName: { type: string }
        EntryTimeEpoch: { type: integer, format: int64, example: 1739215646000 }
        EntryTimeUtc: { type: string, description: 'Ignored; EntryTimeEpoch is the event time.' }
        DeviceId: { type: string, pattern: '^[0-9]{15}$' }
        DeviceName: { type: string }
        AccountId: { type: integer, example: 478 }
        Temperature: { type: object }
        ProbeTemperature: { type: object, nullable: true }
        Humidity: { type: object, nullable: true }
        Accelerometer: { type: object, nullable: true }
        Light: { type: object, nullable: true }
        Battery: { type: object, nullable: true }
        Cellular: { type: object, nullable: true }
        Shipment: { type: object, nullable: true }
        Location: { type: object }

    IngestResponse:
      type: object
      required: [event_id, request_id, status, flags, errors]
      properties:
        event_id: { type: string, example: evt_01JABCDEF }
        request_id: { type: string, example: req_01JABCDEF }
        status:
          type: string
          enum: [accepted, flagged, duplicate, conflict, rejected, failed, queued]
        sensor:
          allOf: [ { $ref: '#/components/schemas/SensorRecord' } ]
          nullable: true
        location:
          allOf: [ { $ref: '#/components/schemas/LocationRecord' } ]
          nullable: true
        flags:
          type: array
          items: { $ref: '#/components/schemas/Flag' }
        errors:
          type: array
          items: { $ref: '#/components/schemas/Problem' }

    Flag:
      type: object
      required: [code, severity]
      properties:
        code:
          type: string
          enum:
            - INVALID_COORDINATES
            - SENSOR_FAULT
            - OUT_OF_RANGE
            - COERCED_TYPE
            - INVALID_TYPE
            - TIMESTAMP_SECONDS
            - DEVICE_RESOLVED_BY_NAME
            - IDENTITY_MISMATCH
            - TEMPERATURE_FALLBACK
            - TEMPERATURE_CONVERTED
            - DUPLICATE_CONFLICT
        severity: { type: string, enum: [info, warn, error] }
        field: { type: string, example: Location.Latitude }
        value: { description: Original value as sent }
        new_value: { description: Replacement value, for fixes }
        action: { type: string, enum: [nullified, fixed, location_skipped, kept, replaced, rejected] }
        rule_id: { type: string, example: LAT-RANGE }

    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [INVALID_JSON, NO_DEVICE_IDENTITY, NO_TIMESTAMP, TIMESTAMP_FUTURE, NO_USABLE_DATA, UNAUTHORIZED, PAYLOAD_TOO_LARGE, NOT_FOUND, NOT_REPLAYABLE, INVALID_REQUEST, UNAVAILABLE, INTERNAL]
        field: { type: string }
        message: { type: string }

    ErrorResponse:
      type: object
      required: [request_id, errors]
      properties:
        request_id: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/Problem' }

    SensorRecord:
      type: object
      description: Conforms to assignment/px-sensor-schema.json
      required: [device_id, device_imei, timestamp, provider, type, temperature]
      properties:
        device_id: { type: string }
        device_imei: { type: string }
        timestamp: { type: integer, format: int64 }
        provider: { type: string, enum: [Tive] }
        type: { type: string, enum: [Active] }
        temperature: { type: number, nullable: true }
        humidity: { type: number, nullable: true }
        light_level: { type: number, nullable: true }
        accelerometer:
          type: object
          nullable: true
          properties:
            x: { type: number, nullable: true }
            y: { type: number, nullable: true }
            z: { type: number, nullable: true }
            magnitude: { type: number, nullable: true }
        tilt: { type: object, nullable: true }
        box_open: { type: boolean, nullable: true }

    LocationRecord:
      type: object
      description: Conforms to assignment/px-location-schema.json
      required: [device_id, device_imei, timestamp, provider, type, latitude, longitude]
      properties:
        device_id: { type: string }
        device_imei: { type: string }
        timestamp: { type: integer, format: int64 }
        provider: { type: string, enum: [Tive] }
        type: { type: string, enum: [Active] }
        latitude: { type: number }
        longitude: { type: number }
        altitude: { type: number, nullable: true }
        location_accuracy: { type: integer, nullable: true }
        location_accuracy_category: { type: string, enum: [High, Medium, Low], nullable: true }
        location_source: { type: string, nullable: true, example: WiFi }
        address:
          type: object
          nullable: true
          properties:
            street: { type: string, nullable: true }
            locality: { type: string, nullable: true }
            state: { type: string, nullable: true }
            country: { type: string, nullable: true }
            postal_code: { type: string, nullable: true }
            full_address: { type: string, nullable: true }
        battery_level: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        cellular_dbm: { type: number, nullable: true }
        cellular_network_type: { type: string, nullable: true }
        cellular_operator: { type: string, nullable: true }
        wifi_access_points: { type: integer, nullable: true }

    EventDetail:
      type: object
      required: [event_id, status, received_at]
      properties:
        event_id: { type: string }
        request_id: { type: string }
        status: { type: string, enum: [accepted, flagged, duplicate, conflict, rejected, failed] }
        received_at: { type: string, format: date-time }
        processed_at: { type: string, format: date-time, nullable: true }
        transform_version: { type: string }
        rules_version: { type: string }
        raw_payload: { type: object, description: The payload exactly as received }
        sensor: { allOf: [ { $ref: '#/components/schemas/SensorRecord' } ], nullable: true }
        location: { allOf: [ { $ref: '#/components/schemas/LocationRecord' } ], nullable: true }
        flags: { type: array, items: { $ref: '#/components/schemas/Flag' } }
        errors: { type: array, items: { $ref: '#/components/schemas/Problem' } }

    ReadingsPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              timestamp: { type: integer, format: int64 }
              event_id: { type: string }
