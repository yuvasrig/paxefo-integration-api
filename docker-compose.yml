# Local stack: Postgres 16 and the API (migrations run at startup).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: paxafe
      POSTGRES_PASSWORD: paxafe
      POSTGRES_DB: paxafe
    volumes:
      - pgdata:/var/lib/postgresql/data   # kept across `docker compose down`; `down -v` removes it
    ports:
      - "5433:5432"   # 5433 on the host: a local Postgres often already owns 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paxafe"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://paxafe:paxafe@db:5432/paxafe?sslmode=disable
      ROLE: all
      INGEST_MODE: sync
      LOG_LEVEL: info
      ADMIN_TOKEN: local-admin-token   # enables the console at http://localhost:8080/admin (local use only)
      SETTINGS_REFRESH_INTERVAL: 3s
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}   # optional: where alerts are posted, e.g. a Slack incoming webhook
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
