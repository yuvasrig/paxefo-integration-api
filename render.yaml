# Render blueprint: Integration API + free Postgres, same region.
databases:
  - name: paxafe-db
    plan: free
    region: oregon
    databaseName: paxafe
    user: paxafe

services:
  - type: web
    name: paxafe-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass   # deploy main only after CI is green
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paxafe-db
          property: connectionString   # internal URL
      - key: ROLE
        value: all
      - key: INGEST_MODE   # default for tenants with no mode of their own; seeded reviewer stays sync, the others are async
        value: async
      - key: WORKERS_MIN   # idle workers per async tenant; 0 keeps free-tier Postgres connections free
        value: "0"
      - key: WORKERS_MAX   # most workers per tenant pool (tenants x this must stay under DB_MAX_CONNS)
        value: "3"
      - key: DB_MAX_CONNS
        value: "15"
      - key: LOG_LEVEL
        value: info
      - key: ADMIN_TOKEN   # enables /admin; you type the value into the Render dashboard (never committed)
        sync: false
