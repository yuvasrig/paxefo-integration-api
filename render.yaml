# Render blueprint: Integration API + free Postgres, same region.
databases:
  - name: paxafe-db
    plan: free
    region: oregon
    databaseName: paxafe
    user: paxafe

services:
  - type: web
    name: paxafe-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass   # deploy main only after CI is green
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paxafe-db
          property: connectionString   # internal URL
      - key: ROLE
        value: all
      - key: INGEST_MODE   # default for tenants with no mode of their own; seeded reviewer stays sync, the others are async
        value: async
      - key: WORKERS_MIN   # idle workers per async tenant; 0 keeps free-tier Postgres connections free
        value: "0"
      - key: WORKERS_MAX   # most workers per tenant pool (tenants x this must stay under DB_MAX_CONNS)
        value: "3"
      - key: WORKERS_TOTAL_MAX   # hard cap on workers in this process across all tenants (0 = none); editable in /admin
        value: "6"
      - key: DB_MAX_CONNS
        value: "15"
      - key: LOG_LEVEL
        value: info
      - key: ADMIN_TOKEN   # enables /admin; you type the value into the Render dashboard (never committed)
        sync: false

  # Scale-out layout (paid): run the web service as ROLE=api and enable this worker service, same image and database.
  # See docs/adr/0001-deployment-topology.md. Free tier: leave it commented out and keep ROLE=all above.
  #
  # - type: worker
  #   name: paxafe-worker
  #   runtime: docker
  #   plan: starter
  #   region: oregon
  #   dockerfilePath: ./Dockerfile
  #   envVars:
  #     - key: DATABASE_URL
  #       fromDatabase: { name: paxafe-db, property: connectionString }
  #     - key: ROLE
  #       value: worker
  #     - { key: WORKERS_MIN, value: "0" }
  #     - { key: WORKERS_MAX, value: "3" }
