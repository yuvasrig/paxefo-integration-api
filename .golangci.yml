version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - bodyclose
    - misspell
  exclusions:
    rules:
      # Best-effort writes to an output stream and closing readers/connections we are done with: nothing useful to do on error.
      - linters: [errcheck]
        text: 'Error return value of .*(Fprint|Fprintf|Fprintln|Close).* is not checked'
